[project]
name = "returns-policy-agent"
version = "0.1.0"
description = "A customer-service agent for a fictional retailer that handles return, exchange, and refund requests in natural language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
